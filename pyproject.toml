[project]
name = "condosys"
version = "0.1.0"
description = "Automação da rotina fiscal de condomínios (ISSNet DF)."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Matheus Sesso" }]
dependencies = [
    "cryptography>=44",
    "httpx>=0.27",
    "keyring>=25",
    "openpyxl>=3.1",
    "playwright>=1.47",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "rich>=13.9",
    "typer>=0.15",
]

[project.scripts]
condosys = "condosys.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/condosys"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "D"]
ignore = [
    "D100", # module docstrings are optional
    "D104", # package docstrings are optional
    "D105", # magic methods
    "D107", # __init__ docstring lives on the class
    "RUF001", # Portuguese text in user-facing strings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["condosys"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "browser: needs the Playwright Chromium browser installed (uv run playwright install chromium)",
]
